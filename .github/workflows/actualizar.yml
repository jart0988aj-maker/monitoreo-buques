name: Actualizar monitoreo

on:
  schedule:
    - cron: "7,37 * * * *"     # cada 30 minutos
  workflow_dispatch:
  push:
    paths:
      - "docs/data/embarques.csv"
      - "scripts/**"

permissions:
  contents: write

concurrency:
  group: actualizar
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install websockets==13.1

      - name: Recolectar datos AIS
        id: ais
        continue-on-error: true
        working-directory: scripts
        env:
          AISSTREAM_API_KEY: ${{ secrets.AISSTREAM_API_KEY }}
          DURACION_SEGUNDOS: "240"
        run: python recolectar.py

      - name: Calcular pronósticos
        working-directory: scripts
        run: python pronosticar.py

      - name: Guardar resultados
        run: |
          git config user.name "monitoreo-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet && exit 0
          git commit -m "Datos AIS $(date -u +'%Y-%m-%d %H:%M') UTC"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            sleep 5
          done
          exit 1
